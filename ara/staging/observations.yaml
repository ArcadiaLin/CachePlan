      ~482 行规格（跨所有编译任务逐字相同）在本次上下文里排在用户的 per-run 消息之后，
      与 C10 描述的 P4A v1 反模式结构相同 —— 固定知识通过 skill 加载机制进入上下文，
      但位置由调用时机决定，而非由其不变性决定。
