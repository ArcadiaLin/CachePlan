# e09 v2 图谱：按 docs/designs/v2/graph_model_v2.md 入库。
# 与 neo4j-e08（v1 图谱）数据目录分开、端口相同，同一时间只起一个。
services:
  neo4j-e09:
    image: neo4j:ubi10
    container_name: neo4j-e09

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/password

    volumes:
      - ./data:/data
      - ./logs:/logs

    restart: unless-stopped
