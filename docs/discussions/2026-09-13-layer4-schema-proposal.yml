# =============================================================================
# P4A Layer4 Schema 提议稿（v2 → v3），带逐行注释的完整实例
# =============================================================================
#
# 状态：**提议，未商定，未实施。** 本文件只是把
# `docs/discussions/2026-09-11-layer4-schema-revision.md` 的六条改造、第 4 节的三项
# 建议实现与第 5 节的精简，写成一份可以逐行讨论的 YAML。没有任何字段进入
# `experiments/p4a/src/extract/layer4_v2/schemas.py`，v1/v2 产物格式保持原样。
#
# 怎么读：
#   - 结构按 v1 的 `paper_record.yml` + `resource_records.yml` 两份文件组织，
#     便于与 `docs/discussions/p4a-v1-protocol.md` 的 4.1 / 4.2 示例逐行对照。
#   - 行尾注释的标记含义：
#       [v1]  沿用 v1 字段，语义不变
#       [改]  v1 有这个字段，但形态或取值约束变了（括号里是改造编号）
#       [新]  v1 没有，本次新增（括号里是依据的小节）
#       [路]  v1 写了但恒空，本次不删、改为接上已有的产出路径
#       [删]  v1 有、本次建议删除——不出现在正文里，集中列在文件末尾的附录 B
#   - 括号里的 6.x / 第 N 节，指 2026-09-11 那份意见稿的小节号。
#   - A1–A4 指 `paper/introduction.zh.md` 的四类研究活动：
#     A1 发现 / A2 甄别 / A3 扩展与引证 / A4 复现与使用。
#
# 示例取值的来源与可信度：
#   实例仍用 `2025.acl-long.803`（LIFBench），与 v1 协议 4.1/4.2 同一篇，方便对照。
#   [v1] 标记的取值抄自该论文的真实 v1 产物；[新]/[改] 标记的取值是按论文内容
#   手写的**示例**，没有重新抽取，char_span、paragraph_index 等定位数字尤其
#   只表示形态、不表示实测结果。
#
# =============================================================================
# 文件 1/2：paper_record.yml —— 单篇论文的记录
# =============================================================================

paper_record:                                        # [v1] 顶层键不变，一篇论文一个文件
  paper_id: paper::2025.acl-long.803                 # [v1] 主键，由 ACL 论文号生成，全局唯一
  source_type: paper                                 # [v1] 记录类型，当前只有 paper 一种
  schema_version: layer4/v3-proposal                 # [新] 产物自带 schema 版本，避免混批时靠目录猜
  pipeline_run_id: e07-trial-001                     # [新] 哪一次运行产出的，便于回溯与重跑对账

  metadata:                                          # [v1] 论文元数据，绝大部分来自 ACL/arXiv，不靠 LLM
    title: 'LIFBENCH: Evaluating the Instruction Following Performance and Stability of Large Language Models in Long-Context Scenarios'  # [v1] 标题原文
    authors:                                         # [改] v1 恒空 100%；改为从 source_artifacts.arxiv.authors 回填，不由 LLM 抽
    - Xiaodong Wu                                    # [改] 回填结果：第一作者
    - Minhao Wang                                    # [改] 回填结果：第二作者（示例只列两位，实际全列）
    year: '2025'                                     # [v1] 发表年份，字符串以免 YAML 转成数字
    venue: ACL-LONG 2025                             # [v1] 会议与论文组
    arxiv_id: '2411.07037'                           # [v1] arXiv 号；e07 里约三分之一论文匹配不到，留空是外部事实
    acl_id: 2025.acl-long.803                        # [v1] ACL 号，与 paper_id 同源
    doi: ''                                          # [改] v1 恒空 100%：保留字段但必须由 absence 三态说明为何空（见 field_status）
    url: https://arxiv.org/abs/2411.07037            # [v1] 论文入口 URL
    pdf_path: data/processed/mineru/acl/2025/acl/2025.acl-long.803/vlm/2025.acl-long.803_origin.pdf          # [v1] 本地 PDF 副本
    markdown_path: data/processed/mineru/acl/2025/acl/2025.acl-long.803/vlm/2025.acl-long.803.md            # [v1] MinerU 解析出的全文 markdown，是全部证据定位的基准文件
    content_list_path: data/processed/mineru/acl/2025/acl/2025.acl-long.803/vlm/2025.acl-long.803_content_list_v2.json  # [v1] MinerU 的块级结构，表格与图片原料在这里

  content_units:                                     # [v1] 从论文正文切出的内容单元
    abstract: 'As Large Language Models (LLMs) evolve in natural language processing (NLP), their ability to stably follow instructions in long-context inputs has become critical for real-world applications. ...'  # [v1] 摘要原文（示例截断）
    section_outline:                                 # [改] v1 只有 level/title/line；新增 section_id，作为 6.3 证据定位的锚
    - section_id: sec-1                              # [新] 章节稳定标识，由章节序号生成，证据字段引用它而不是引用标题字符串
      level: 1                                       # [v1] 标题层级
      title: 1 Introduction                          # [v1] 标题原文
      line: 28                                       # [v1] 在 markdown 中的起始行号
      paragraph_range: [3, 19]                       # [新] 该章节覆盖的段落序号区间，用于校验证据的 paragraph_index 落在正确章节
    - section_id: sec-4                              # [新] 第二个章节示例：实验章节
      level: 1                                       # [v1]
      title: 4 Experiments                           # [v1]
      line: 301                                      # [v1]
      paragraph_range: [52, 74]                      # [新]
    has_appendix: true                               # [v1] 是否有附录，决定证据是否可能落在正文之外
    has_supplementary_material: false                # [v1] 是否有补充材料
    tables:                                          # [路] v1 恒空 100%；MinerU 已有表格原料，A2 要比较的实验结果主要在表里，故接上产出路径
    - table_id: 2025.acl-long.803::tab::2            # [新] 表的稳定标识，按 content_list 中的出现次序生成
      label: Table 2                                 # [新] 论文里的表号；A3 引证时要指名"表 2"，不能只给内部 id
      caption: Overall performance of 20 LLMs across six length intervals.  # [新] 表题原文，是判断这张表测什么的主要依据
      section_id: sec-4                              # [新] 表所属章节，与 section_outline 对齐
      paragraph_index: 58                            # [新] 表在拼装全文中的段落序号，与证据定位同一套坐标
      body_kind: html                                # [新] MinerU 输出的表体形式：html | markdown | image；image 表示这张表没被解析成结构
      md_span: [412, 455]                            # [新] 表体在 markdown_path 中的行区间，可程序校验存在性
      parsed: true                                   # [新] 表体是否真被解析成行列；false 时下游不得声称读到了表内数值
    figures:                                         # [路] 同为 v1 恒空；但只登记不解析，图内数值不进入记录（第 5 节：先做表，图留待定）
    - figure_id: 2025.acl-long.803::fig::1           # [新] 图的稳定标识
      label: Figure 1                                # [新] 论文里的图号
      caption: Overview of the LIFBENCH construction pipeline.  # [新] 图题原文，当前是图的唯一可用语义
      section_id: sec-1                              # [新] 图所属章节
      paragraph_index: 12                            # [新] 段落序号
      image_path: data/processed/mineru/acl/2025/acl/2025.acl-long.803/vlm/images/fig1.jpg  # [新] 图片文件位置，供人工复核
      parsed: false                                  # [新] 恒为 false：本版不做图内容理解，明写出来以免下游误用

  atomic_extracts:                                   # [v1] LLM 抽取的语义字段集合
    intent:                                          # [v1] 论文意图，服务 A1 的初筛
      paper_type: benchmark                          # [改] 取值表见附录 A；e07 里 77.1% 是 method，筛选价值低，保留但不单独用于过滤
      research_problem: Evaluating LLM instruction-following capabilities and stability in long-context scenarios.  # [v1] 一句话研究问题
      target_domain:                                 # [v1] 领域标签列表，自由文本
      - Long-context LLMs                            # [v1] 领域标签示例
      - Instruction Following                        # [v1] 领域标签示例

    methods:                                         # [新] 第 4 节第 2 条：方法具名实体。A3 的必要条件——没有方法名与别名，沿用关系无从建立
    - method_id: 2025.acl-long.803::method::1        # [新] 方法的稳定标识，篇内唯一
      name: LIFEVAL                                  # [新] 方法/系统的名字，跨论文关联的主键素材（Layer3 再做消歧）
      aliases:                                       # [新] 同一方法的其他写法，供 Layer3 归并
      - LIFEval                                      # [新] 大小写变体
      - rubric-based assessment                      # [新] 论文中使用的描述性别名
      role: proposed                                 # [新] 本文与该方法的关系：proposed | reused | extended | compared
      derived_from: []                               # [新] 沿用来源（被沿用方法的 method_id 或外部 resource_id）；role 为 reused/extended 时必须非空
      produces_resource_id: res.lifeval              # [新] 若该方法有对应的公开产物，指向资源记录，使"方法—实现"可互相到达
      evidence:                                      # [新] 方法具名的证据，结构见下方 evidence 说明
        origin: paper                                # [新] 证据来源类型
        section_id: sec-1                            # [新] 出处章节
        paragraph_index: 9                           # [新] 出处段落
        char_span: [1204, 1388]                      # [新] 段内字符区间（示例值）
        quote: we propose LIFEVAL, a rubric-based assessment method  # [新] 原文片段，可程序比对
    - method_id: 2025.acl-long.803::method::2        # [新] 第二个方法示例：一个被沿用而非提出的方法
      name: Automated Rubric-based Scoring           # [新]
      aliases: [ARS]                                 # [新]
      role: proposed                                 # [新]
      derived_from: []                               # [新]
      produces_resource_id: ''                       # [新] 没有独立公开产物时留空，并在 field_status 里给 absence
      evidence:                                      # [新]
        origin: paper                                # [新]
        section_id: sec-3                            # [新]
        paragraph_index: 41                          # [新]
        char_span: [302, 447]                        # [新]
        quote: Automated Rubric-based Scoring (ARS) assigns scores according to task-specific rubrics  # [新]

    contributions:                                   # [v1] 论文自述贡献，自由文本；e07 空值率 2.0%，完备性够用
    - text: We introduce LIFBENCH, a benchmark designed to evaluate instruction-following capabilities in long-context scenarios, containing 11 tasks across three scenarios.  # [v1] 一条贡献
      evidence:                                      # [改] v1 的 contributions 只有 text；本版要求每条带证据（形状不稳定是 2.2 合并丢失的根因）
        origin: paper                                # [新]
        section_id: sec-1                            # [新]
        paragraph_index: 17                          # [新]
        char_span: [12, 205]                         # [新]
        quote: We introduce LIFBENCH, a benchmark designed to evaluate instruction-following capabilities  # [新]

    claims:                                          # [改] 第 5 节：限 1–2 条，且**必须**链接到支持它的实验；不做链接则整字段删除
    - claim_id: 2025.acl-long.803::claim::1          # [新] 主张的稳定标识
      text: LIFEVAL enables precise automated scoring of complex LLM responses without LLM-assisted assessment or human judgment.  # [v1] 主张正文，来自摘要
      supported_by:                                  # [新] 这条主张由哪些实验记录支持——这是保留 claims 的唯一理由
      - 2025.acl-long.803::exp::2                    # [新] 指向下面 experiments 里的实验 id
      support_strength: partial                      # [新] 由证据链支持到什么程度：direct | partial | claimed_only；claimed_only 表示只有作者说法

    experiments:                                     # [改] 6.1：v1 是 [{text}] 自由文本，不可比较、不可过滤（A2 的最大缺口）；改为结构化
    - experiment_id: 2025.acl-long.803::exp::1       # [新] 实验的稳定标识
      task: long-context instruction following       # [新] 这次实验做的任务，A2 过滤用
      resources_used:                                # [新] 这次实验用到的资源及其角色——把"用了什么"落到实验粒度，而不是论文粒度
      - resource_id: res.lifbench                    # [新] 指向资源记录；注意 id 不含 kind（6.6）
        role: evaluation_target                      # [新] 资源在本次实验中的角色：training_data | evaluation_target | analysis_input | tooling | unknown
        split: ''                                    # [新] 用了哪个 split；A4 复现的关键条件，无则留空并给 absence
        subset: 11 tasks across 3 scenarios          # [新] 用了哪个子集，原文怎么说就怎么记
        version: ''                                  # [新] 资源版本，A4 判断可比性用
      subjects:                                      # [新] 被测对象（模型、系统、方法），与被使用的资源分开记
      - name: 20 prominent LLMs                      # [新] 原文表述；无法拆成具体模型名时保持原样，不猜
        version: ''                                  # [新] 被测对象版本
      conditions:                                    # [新] 实验条件维度，A2 判断差异主要看这里
      - dimension: context_length                    # [新] 条件名
        values: 4k / 8k / 16k / 32k / 64k / 128k     # [新] 条件取值，保留原文写法
      metrics:                                       # [新] 评测指标
      - name: Instruction Following Stability (IFS)  # [新] 指标名
        scoring: program                             # [新] 打分方式：program | llm_judge | human | unknown；A4 复现成本差别很大
      baselines: []                                  # [新] 对照方法；抽不稳定就删字段而不是留空（第 8 节风险 2）
      result_refs:                                   # [新] 结果落在哪张表/图——连上 content_units.tables，使 A3 可以引证到具体表
      - table_id: 2025.acl-long.803::tab::2          # [新]
      evidence:                                      # [新] 这条实验记录的证据定位
        origin: paper                                # [新]
        section_id: sec-4                            # [新]
        paragraph_index: 55                          # [新]
        char_span: [88, 332]                         # [新]
        quote: We conduct detailed experiments on 20 prominent LLMs across six length intervals  # [新]
    - experiment_id: 2025.acl-long.803::exp::2       # [新] 第二条实验：用于支持上面的 claim::1
      task: automated scoring reliability            # [新]
      resources_used:                                # [新]
      - resource_id: res.lifeval                     # [新]
        role: tooling                                # [新]
        split: ''                                    # [新]
        subset: ''                                   # [新]
        version: ''                                  # [新]
      subjects: []                                   # [新] 本条没有独立被测对象，空值含义由 field_status 说明
      conditions: []                                 # [新]
      metrics:                                       # [新]
      - name: agreement with human judgment          # [新]
        scoring: human                               # [新]
      baselines: []                                  # [新]
      result_refs: []                                # [新]
      evidence:                                      # [新]
        origin: paper                                # [新]
        section_id: sec-4                            # [新]
        paragraph_index: 70                          # [新]
        char_span: [15, 240]                         # [新]
        quote: LIFEVAL scores align closely with human evaluation across sampled responses  # [新]

    limitations:                                     # [v1] 论文自述局限，自由文本；A2 甄别时有用，保持不结构化
    - text: Programmatic validation constraints limit support for semantic constraints in task scenarios.  # [v1]
    future_work: []                                  # [v1] 论文自述 future work；e07 空值率 18.3%，空值含义由 field_status 给出

    citation_context:                                # [v1] 从 MinerU 解析结果抽出的引用及其上下文；e07 共 39433 条，每篇中位 40 条
      cite:                                          # [v1] 引用条目列表
      - context_id: 2025.acl-long.803::cite::3       # [v1] 按出现次序生成的引用 id
        raw_citation: (Zhang et al., 2024b)          # [v1] 原文里的引用串
        reference_indices: [12]                      # [v1] 对应参考文献表的序号
        reference_titles:                            # [v1] 对应的参考文献标题
        - 'Longbench: A bilingual, multitask benchmark for long context understanding'  # [v1]
        context: Existing long-context benchmarks such as LongBench (Zhang et al., 2024b) focus on comprehension rather than instruction following.  # [v1] 引用所在的上下文片段
        section: 2 Related Work                      # [v1] 保留原有的章节字符串，便于与历史产物对照
        section_id: sec-2                            # [新] 同时给结构化章节锚，供程序校验
        paragraph_index: 33                          # [v1] 段落序号
        sentence: Existing long-context benchmarks such as LongBench (Zhang et al., 2024b) focus on comprehension rather than instruction following.  # [v1] 引用所在句
        citation_function: benchmark_source          # [改] 第 5 节：改为**选择性**标注，只标七类与 A3 相关的角色，其余一律留空
        anchor_type: arxiv                           # [新] p1 从参考文献解析出的外部锚类型：arxiv | doi | url | none
        anchor: '2308.14508'                         # [新] 锚值本身，是跨论文连边的依据
        target_paper_id: ''                          # [新] 若被引论文在本地语料内，回填其 paper_id；否则留空表示语料外
        resolved_in_corpus: false                    # [新] 是否匹配回语料内论文；e07 的 43633 条参考文献里只有 85 条能匹配上
      - context_id: 2025.acl-long.803::cite::1       # [v1] 第二条：一个泛引用的例子
        raw_citation: (Achiam et al., 2023; Brown, 2020)  # [v1]
        reference_indices: [1, 6]                    # [v1]
        reference_titles:                            # [v1]
        - Gpt-4 technical report                     # [v1]
        - Language models are few-shot learners      # [v1]
        context: As Large Language Models (LLMs) continue to make significant strides across practical applications (Achiam et al., 2023; Brown, 2020)  # [v1]
        section: 1 Introduction                      # [v1]
        section_id: sec-1                            # [新]
        paragraph_index: 6                           # [v1]
        sentence: As Large Language Models (LLMs) continue to make significant strides across practical applications.  # [v1]
        citation_function: ''                        # [改] 背景性泛引用不产生可用的追踪边，按选择性标注规则留空（v1 会标成 background）
        anchor_type: arxiv                           # [新]
        anchor: '2303.08774'                         # [新]
        target_paper_id: ''                          # [新]
        resolved_in_corpus: false                    # [新]

  links:                                             # [路] 取代 v1 的 `cites` / `cited_by` 两个恒空字段；数据来自 p1 的 cite_anchors.jsonl，不依赖外部 API
    cites:                                           # [路] 出边：本文引了谁。A3 的直接承载
    - reference_index: 12                            # [新] 参考文献表序号，回指 citation_context 的 reference_indices
      anchor_type: arxiv                             # [新] 锚类型
      anchor: '2308.14508'                           # [新] 锚值
      target_paper_id: ''                            # [新] 语料内论文的 id；语料外留空
      resolved_in_corpus: false                      # [新] 是否落在本地语料内
      context_ids:                                   # [新] 该参考文献在正文中的引用位置，使"引了谁"能落到"在哪引、作什么用"
      - 2025.acl-long.803::cite::3                   # [新]
      roles:                                         # [新] 由上面各 context 的 citation_function 汇总而来，A3 按角色筛边
      - benchmark_source                             # [新]
    cites_summary:                                   # [新] 建边统计，便于一眼看出这篇的引文边有多少可用
      references_total: 61                           # [新] 参考文献总数
      anchored: 22                                   # [新] 解析出锚的条数
      resolved_in_corpus: 1                          # [新] 匹配回语料内的条数

  source_artifacts:                                  # [v1] 论文的外部源材料；v2 已把 HTML/TeX 下载后置为可选增强，本版保持不变
    arxiv:                                           # [v1] arXiv 元数据
      arxiv_id: '2411.07037'                         # [v1]
      version: v3                                    # [v1] 抓取到的版本号，A4 判断材料时效性用
      url: https://arxiv.org/abs/2411.07037          # [v1]
      metadata_status: available                     # [v1] available | unfetched | missing
      metadata_checked_by: arxiv-mcp                 # [改] 取值收进受控词表（附录 A），不再是自由文本
      authors:                                       # [v1] arXiv 侧作者列表，是 metadata.authors 的回填来源
      - Xiaodong Wu                                  # [v1]
      - Minhao Wang                                  # [v1]
      submitted: '2024-11-11'                        # [v1] 首次提交时间
      updated: ''                                    # [v1] 最近更新时间
      primary_category: cs.CL                        # [v1] arXiv 主分类
    html_downloaded:                                 # [v1] arXiv HTML 版本的下载结果
      exists: true                                   # [v1] 是否存在该形式的源材料
      status: available                              # [v1] 下载状态
      path: data/processed/layer4/2025.acl-long.803/arxiv/html/2411.07037.html  # [v1] 本地路径
      checked_by: curl                               # [改] 同样收进受控词表
      notes: HTML downloaded successfully.           # [v1] 人读备注
    tex_source_downloaded:                           # [v1] arXiv TeX 源码的下载结果，字段同上
      exists: true                                   # [v1]
      status: available                              # [v1]
      path: data/processed/layer4/2025.acl-long.803/arxiv/src/2411.07037.tar.gz  # [v1]
