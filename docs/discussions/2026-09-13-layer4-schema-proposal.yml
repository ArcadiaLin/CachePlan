# =============================================================================
# 附录 A：受控词表（凡本文件标注"受控词表"的字段，取值只能来自这里）
# =============================================================================
#
# paper_type:      survey | empirical | benchmark | dataset | method | theory | position | unknown
#                  （沿用 v1；e07 里 77.1% 是 method，单独拿来过滤没有区分度）
# kind:            dataset | benchmark | code | model | tool
#                  （删掉 v1 的 skill / protocol / resource：e07 4758 条里合计只有 69 条，
#                   且三者边界从未写清；kind 现在是可修正属性，误判不再固化进 id）
# role（资源）:     introduced | used | evaluated | cited_only | unknown
#                  （删掉 extended：两份语料里各只有 2 条，改动改由 modification 字段承载）
# role（方法）:     proposed | reused | extended | compared
# role（实验内）:   training_data | evaluation_target | analysis_input | tooling | unknown
# access_type:     public | request_only | restricted | missing | unknown          （沿用 v1）
# availability:    available | partial | missing | broken | empty | unknown        （沿用 v1）
# scoring:         program | llm_judge | human | mixed | unknown
# citation_function（选择性标注，其余一律留空）:
#                  dataset_source | benchmark_source | baseline | method_source |
#                  model_source | tool_source | contrast
#                  （v1 还有 background / related_work / claim_support / comparison / other /
#                   unknown；e07 里 background + method_source 占四成，background 这类泛引用
#                   不产生可用的追踪边，本版不标）
# evidence.origin: paper | repository | model_card | dataset_card | external_page
#                  （2.7：v1 把论文内证据与 README 证据塞进同一个自由文本字段，
#                   导致这类证据永远无法在正文定位）
# field_status.source:   paper_claim | external_observation | inferred
# field_status.absence:  not_applicable | not_found | not_checked
# observed_by:     github_api | huggingface_api | arxiv_api | web_fetch | agent | human
#                  （v1 的 checked_by 在 e07 里出现 29 个自由取值，其中 8 个
#                   ——paper / paper_evidence / paper_derived / paper_claimed / paper_only /
#                   paper_assertion / paper_url / paper_and_reference——表达的都是"没查"。
#                   本版把"没查"移到 source: paper_claim，observed_by 只留真正的观察者）
# registry_status: matched | split_by_spelling | needs_context | unregistered
#                  （对应 p1 建边的四类结果：命中 1541 / 拼写拆分 66 / 待上下文确认 21 / 未注册）
#
# =============================================================================
# 附录 B：本版删除的 v1 字段，以及删除理由
# =============================================================================
#
# metadata.doi                          保留字段但恒空 → 改为必须给 absence；不再默认留白
# content_units.figures[].内容解析        不做图内容理解，只登记 caption 与路径（parsed 恒 false）
# cites / cited_by（篇级两个恒空字段）      cites 改由 links.cites 承载（接 p1 的 cite_anchors.jsonl）；
#                                       cited_by 删除：它需要外部 API，p1 的锚点边覆盖不到
# atomic_extracts.citation_context.cited_by   删除：要求把被引关系落到具体引用上下文，无产出路径
# source_paper / comparison              删除：v1 示例里就是空串，语义从未定义
# availability_check.checked_at          删除：与 provenance.last_checked 功能重复，且恒空；
#                                       真正需要的"何时观察"由 availability.observed_at 承担
# agent_callable（can_wrap / difficulty / notes）  删除：e07 里 can_wrap False 91.4%、
#                                       difficulty unknown 90.8%、notes 空 65.5%，无证据、
#                                       无区分度、无法核验；其意图由 material_completeness 承接
# v1 4.3 的 skill_wrapped / skill_candidate       删除，同上
# extraction_confidence（模型自评）        删除：e07 里 82.5% 是 high，没有区分度；
#                                       改用 field_status.source 回答"谁观察到的"
# relation_type: extended                删除该枚举值，改由 paper_relation.modification 承载
# kind: skill / protocol / resource      删除这三个取值（见附录 A）
#
# =============================================================================
# 附录 C：这份 schema 没有解决的问题
# =============================================================================
#
# 1. 新字段的正确性比旧字段难核验。experiments 与 profile 若没有独立小样本标注，
#    很可能只是变长的自由文本。2026-09-11 意见稿第 2 节能给出那么多数字，
#    恰恰因为那些都是结构性指标；本文件新增字段的价值量不在结构层。
# 2. 字段数量本身是风险。experiments 与 profile 已接近上限形态。试抽若显示
#    baselines / subset / splits.size 抽不稳定，直接删掉，不要留空占位——
