[project]
name = "cacheplan-e09"
version = "0.1.0"
description = "E09: v2 数据模型的真实论文入库与访问算子检验"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# 只声明流水线自己 import 的包；notebook 工具在根的 [dependency-groups]。
# embedding 服务（httpx）等到检索算子需要时再加。
dependencies = [
    "neo4j>=5.28,<7",   # 图谱读写
    "pyyaml>=6,<7",     # 种子与入库增量
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e09"]
