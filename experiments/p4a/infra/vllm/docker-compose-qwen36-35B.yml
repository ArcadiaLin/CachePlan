# docker compose -f docker-compose-qwen36-35B.yml up -d
services:
  vllm-qwen36-35b:
    # 版本必须钉死，不得用 :latest。
    #
    # P4A 的历史运行用的是未钉版本的 :latest，当时解析到 **0.21.0**。该版本的
    # OpenAI 兼容响应不上报 cache 统计：非流式返回 prompt_tokens_details: null，
    # 流式连这个 key 都没有。于是 kimi-code 的 extractUsage 取不到 cached_tokens
    # 而记 0（packages/kosong/src/providers/openai-common.ts:204），全部 4083 份
    # session 日志的 inputCacheRead 恒为零 —— 那是**上报缺陷，不是缓存未命中**。
    # 服务端当时开着 --enable-prefix-caching，实测命中率 86.5%。
    #
    # 0.22.1 已修复：非流式与流式均返回
    #   prompt_tokens_details.cached_tokens，且与 /metrics 的
    #   prefix_cache_hits_total 增量精确相等（2026-09-01 实测，两种模式各验一次）。
    #
    # 结论依赖上报行为，所以 :latest 是复现性隐患 —— 同一个 tag 在两天内改变了
    # 语义。任何变更版本都必须重跑一次上报验证。
    image: vllm/vllm-openai:v0.22.1
    container_name: vllm-qwen36-35b
    runtime: nvidia

    ports:
      - "8003:8000"

    volumes:
      - /srv/models/Qwen3.6/Qwen3.6-35B-A3B:/models/Qwen3.6-35B-A3B

    ipc: host

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Equivalent to: docker run --gpus '"device=2,3"'
    gpus:
      - driver: nvidia
        device_ids: ["2", "3"]
        capabilities: [gpu]

    command:
      - --model
      - /models/Qwen3.6-35B-A3B

      # ===== 服务监听 =====
      - --host
      - 0.0.0.0
      - --port
      - "8000"

      # ===== 访问鉴权（OpenAI API Key）=====
      # 启用后，请求时需要带：
      # Authorization: Bearer sk-xxxxxx
      # - --api-key
      # - sk-your-secret-token

      # ===== 张量并行 =====
      - --tensor-parallel-size
      - "2"

      # ===== 数据类型 / 精度 =====
      # 可选：auto / half / float16 / bfloat16 / float / float32
      # A800 通常更推荐 bfloat16 或 auto
      - --dtype
      - bfloat16

      # ===== 最大上下文长度 =====
      - --max-model-len
      - "262144"

      # ===== GPU 显存利用率 =====
      # 默认通常偏保守，可手动调高
      - --gpu-memory-utilization
      - "0.9"

      # ===== 并发 / 调度 =====
      # - --max-num-seqs
      # - "16"
      # - --max-num-batched-tokens
      # - "8192"

      # ===== KV Cache 数据类型 =====
      # 可选: auto / fp8 / fp8_e5m2 / fp8_e4m3
      # 需要硬件与版本支持
      # - --kv-cache-dtype
      # - fp8

      # ===== 信任远程代码 =====
      # 某些 Hugging Face 模型需要
      # - --trust-remote-code

      # ===== 模型名称（API 返回名）=====
      # 不写的话一般就是模型路径
      - --served-model-name
      - qwen3.6-35b-a3b

      # ===== tool call 设置 =====
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder

      # ===== reasoning 输出设置 =====
      - --reasoning-parser
      - qwen3

      # ===== 限制日志级别 =====
      # - --uvicorn-log-level
      # - info

      # ===== eager 模式，排查问题时有用 =====
      # - --enforce-eager

      # ===== 前缀缓存 =====
      # 一般可提升重复前缀请求性能
      - --enable-prefix-caching

      # ===== 在 usage 里上报 prefix cache 命中 =====
      # 让响应体带 prompt_tokens_details.cached_tokens，kimi-code 才能把
      # 每次请求的真实命中数记进 wire.jsonl（否则只能靠 /metrics 全局计数器
      # 做差，要求请求串行且服务器上无其他流量）。缺了它就是 P4A 历史日志
      # inputCacheRead 恒为零的成因，见文件顶部 image 处的说明。
      - --enable-prompt-tokens-details

      # ===== 量化（如果你的模型就是量化版，可启用）=====
      # 常见如 awq / gptq / fp8
      # - --quantization
      # - awq

      # ===== CPU offload（显存不够时尝试）=====
      # - --cpu-offload-gb
      # - "10"

      # ===== swap 空间 =====
      # - --swap-space
      # - "16"

      # ===== 禁用请求日志（压日志量）=====
      # - --disable-log-requests

    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    restart: unless-stopped
