[project]
name = "cacheplan-e01"
version = "0.1.0"
description = "E01: P4A 历史 session 轨迹的全量观测研究（只读、不跑 agent）"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# 主线阶段（s0-s2、s4-s5）**只用标准库**。这是刻意的：整条流水线必须能在
# 没有网络、没有模型下载的机器上原样复现。
dependencies = []

[project.optional-dependencies]
# 阶段 3 起逐字还原进入模型的 token 序列，需要模型自带的 chat template（jinja2）
# 和分词器。**没有字符级的退化路径** —— s3 拿不到这两样会直接退出，见 render.py。
# 仍放在 optional 里，是为了让 s0-s2 在没有网络的机器上照样能跑。
render = ["jinja2>=3.1,<4", "tokenizers>=0.20,<0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e01"]
