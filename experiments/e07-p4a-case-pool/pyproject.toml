[project]
name = "cacheplan-e07"
version = "0.1.0"
description = "E07: P4A 候选池——961 观测集论文子集 + 噪声 + 资源/引文扩展，服务叙事案例寻找"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# p0（语料复制）保持 stdlib-only，由 make verify-stdlib 的隔离环境闸门背书。
# p1 起要读 layer4 的 YAML 记录，引入 pyyaml 作为唯一第三方依赖；依赖清单
# 仍保持最小，隔离闸门验证"干净环境装完声明依赖即可复现"。
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e07"]
