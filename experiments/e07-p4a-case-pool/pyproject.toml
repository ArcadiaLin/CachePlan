[project]
name = "cacheplan-e07"
version = "0.1.0"
description = "E07: P4A 候选池——961 观测集论文子集 + 噪声 + 资源/引文扩展，服务叙事案例寻找"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# 主线阶段只用标准库，与 e01 同一条约定：必须能在没有网络、没有第三方包的
# 机器上原样复现。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e07"]
