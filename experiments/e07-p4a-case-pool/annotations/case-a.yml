  issue: cite_contexts 仅 31 个引用点、覆盖 88 条参考文献中的 42 条；
         AWM/Voyager/SkillWeaver（ref 64/58/85）无引用上下文
  handling: p2 核查到该篇时从 mineru 正文人工摘取相关句子记入 evidence
- paper: 2026.acl-industry.7
  issue: paper_record title 字段误抽为作者列表
  handling: 标注层修正或排除；关键词/标题类扫描对该篇不可信
- paper: 2026.acl-industry.46
  issue: 参考文献列表重复收录 AWM（index 26/27，同一 arXiv:2409.07429）
  handling: cite_anchors 已按 arXiv 号去重，计数不受影响；保留为消歧叙事素材

