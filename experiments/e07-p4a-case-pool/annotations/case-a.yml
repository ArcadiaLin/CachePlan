# E07 案例 A 标注：需求条件（query spec）与候选核查判断
#
# 口径：
# - 本文件是人工/agent 核查的标注材料，版本化、可 diff；不放 data/processed
#   （那边只放可重建产物）。
# - conditions 是判断基准，版本化固定；为排除某论文而事后收紧条件是不允许的，
#   确需调整时升版本并记录原因（见 docs 案例 A 的明确要求）。
# - judgments 取值：satisfied / partial / not_satisfied / insufficient_evidence /
#   unchecked。判断必须附 evidence（材料位置 + 摘录），区分论文声称与材料观察。
# - entry_path 记录候选进入池子的途径，与判断标签分开。
# - note 记录核查结论要点与保留点；eval_notes 记录评测协议细节（案例 A4 素材）。

case: A
title: 从 Agent 执行轨迹寻找可复用经验
spec_version: v1
spec_updated: 2026-09-13

# query 设计（2026-09-13 与用户商定）：同时包含"调研相关工作"与"验证我的想法"，
# 使 intro 的 A1–A4（发现/甄别/扩展与引证/复现与使用）四类活动在案例中都有真实
# 任务。c1–c4 条件保持领域中性，web 仅作为研究者的目标评测场景出现——领域外
# 的相关工作因此成为 A2 甄别的真实考题，而非被 query 预先过滤。
query: >
  我在做一个方法：让 web agent 从自身执行轨迹中提炼可复用的经验产物
  （workflow / skill / 经验条目），并在后续新任务上调用。
  帮我找出已经做了这件事或相近事情的研究，判断它们各自做到哪一步；
  沿引用和资源关系补齐我没想到的相关工作与评测资源；
  最后帮我确定用哪个 benchmark、对照哪些 baseline、按什么口径评测。

# 满足条件（v1）：逐项判断，全部 satisfied 才是种子正例。
conditions:
- {id: c1, label: 轨迹输入,
   detail: 方法以 agent 执行轨迹或多次执行历史为输入，而非仅当前任务的单次上下文}
- {id: c2, label: 抽象产物,
   detail: 从轨迹中提炼出显式的中间产物（workflow / plan / skill / 经验条目等），
   而非仅把历史摘要或拼接进 prompt}
- {id: c3, label: 后续调用,
   detail: 产物在后续（新任务或新 episode）执行中被检索或调用，并实际影响行为}
- {id: c4, label: 跨任务复用,
   detail: 产物服务于与其来源不同的任务或场景（跨任务、跨站点或跨环境）}

# 明确暂不纳入 v1 条件的维度（保留记录，不用于排除）：
non_conditions:
- 轨迹是否必须自身生成（人工演示来源不自动排除，见 Synapse 讨论）
- 经验构建是在线还是离线（ExpeL 的离线阶段不自动排除）

# 已知材料缺陷与处理口径（2026-09-13 用户确认）：语料后续会全面重写、schema
# 会调整，现状缺陷不代表成品、不视为问题，只要满足叙事即可；均不改上游管线。
