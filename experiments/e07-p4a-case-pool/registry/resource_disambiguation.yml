#####################################################################
# 2. merge_map：归一化 key -> 规范 id（仅列非自映射的；未列出的 key
#    默认自成身份）。spelling 变体已在 corpus_keys 内，无需重复。
#####################################################################
merge_map:
  # 跨 key 合并（同物不同写法/年份写法）
  aime2024: aime-2024
  amc2023: amc-2023
  arcc: arc-challenge
  arce: arc-easy
  naturalquestionsnq: natural-questions
  humanevalplus: humaneval-plus
  gpqad: gpqa-diamond
  gpqadiamondmc: gpqa-diamond
  minerva: minerva-math
  minervamath: minerva-math
  musiqueans: musique
  squadv11: squad
  squadv2: squad
  logiqa20: logiqa
  logiqav2: logiqa
  alpacaeval20: alpacaeval
  alpacaeval2: alpacaeval
  alpacaevalv10: alpacaeval
  bfclberkeleyfunctioncallingleaderboard: bfcl
  bfclv3: bfcl
  bfclv4multiturn: bfcl
  browsecompzh: browsecomp
  gaia2: gaia
  gaiatext: gaia
  livecodebenchv5: livecodebench
  livecodebenchv6: livecodebench
  livecodebenchexec: livecodebench
  longbenchv1: longbench
  longbenche: longbench
  longmemevals: longmemeval
  lamp5: lamp
  mmlustem: mmlu
  mmluclinical: mmlu
  mmluproxhealth: mmlu-prox
  mmluproxlite: mmlu-prox
  advbenchadv: advbench
  harmbenchadv: harmbench
  beavertails30k: beavertails
  ultrachat200k: ultrachat
  alpaca52k: alpaca
  alpacacleaned: alpaca
  alpacagpt4: alpaca
  dollyac: dolly
  medqausmle: medqa
  medqabstain: medqa
  mimicivnotes: mimic-iv
  librispeech960h: librispeech
  videommelong: video-mme
  mmbenchgui: mmbench
  flores200devtest: flores-200
  floresmvf: flores-200
  finqatas: finqa
  dapomath: dapo-math-17k
  deepmath: deepmath-103k
  rewardbenchv2: rewardbench
  webwalker: webwalkerqa
  # umbrella 归属（年份/规格不明）
  aime: aime-unspecified
  aime2425: aime-unspecified
  aime2024andaime2025: aime-unspecified
  amc: amc-unspecified
  wikitext: wikitext-unspecified
  # 衍生/变体保持独立身份（不合并，仅登记关系）：
  #   gsm8kv, gsm8kzh, mmluredux, mmluprox, longbenchv2, browsecompplus,
  #   humanevalfix, mbppsanitized, spiderdk, spiderrealistic, spidersyn,
  #   spidertas, math10k, mathvista, mathvision, mathverse, mathqa,
  #   arch..., webquestionssp, flores101, codecontests(+号靠原始拼写拆)
  # —— 以上 key 自成条目或 singleton，不并入。

#####################################################################
# 3. 同 key 拆分规则：归一化后撞 key 但身份不同，建边时必须按原始
#    拼写或上下文拆开。
#####################################################################
split_within_key:
  humaneval:
    "HumanEval": humaneval
    "HumanEval+": humaneval-plus
  mbpp:
    "MBPP": mbpp
    "MBPP+": mbpp-plus
  codecontests:
    "CodeContests": codecontests
    "CodeContests+": codecontests-plus
  prism:
    _by_context: "Kirk et al. 2024 引用 -> prism-alignment；acl-long.1551 自称提出 -> prism-hallucination"

#####################################################################
# 4. v1 抽取噪声 key：不是具体资源，建边时应剔除或人工归位。
