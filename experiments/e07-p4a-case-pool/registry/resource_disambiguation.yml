# E07 资源消歧注册表：dataset / benchmark 名字的规范身份
#
# 用途：p1 构建 paper–resource 边时，把 layer4/resource_records.yml 里的原始
# 名字映射到规范资源身份，避免同名不同物合并、同物不同名分裂。
#
# 口径声明：
# - 输入是 p4a v1 的抽取结果，属于线索；本表消歧的是"名字 → 资源身份"，
#   不担保任何具体论文与该资源的关系描述正确（那是 usage 级核查，见 README）。
# - corpus_keys 是归一化 key（小写、去非字母数字）；未列入 merge_map 的 key
#   默认自成身份，不并入任何规范资源。
# - verification: web-verified = 2026-09-12 经一手来源（论文/官方仓库）核查；
#   known = 整理者熟知、未逐一回源；uncertain = 身份存疑，使用前必须核查。
#
# _provenance:
#   curated_by: kimi (Kimi Code CLI)
#   curated_at: 2026-09-12（第一轮：dataset/benchmark）；2026-09-13（第二轮：
#     model/code/tool/protocol 等，覆盖 >=3 篇的全部未注册名 + ==2 篇的非
#     dataset/benchmark 名，共 128 个名字）
#   source_stats: 952 篇 E07 语料，dataset/benchmark 类共 1837 个归一化名字，
#     其中 >=3 篇提到的 144 个为第一轮主体；<3 篇的只在与主体有合并/混淆
#     关系时收录。第二轮源为 p1 产物的 unregistered_names.jsonl。
#   method: 归一化聚类 -> 本地 evidence 上下文判读（PRISM/CDR/Minerva 等）
#     -> 第一轮 26 项 web 核查；第二轮 38 个名字经 6 组 subagent 一手来源
#     核查（全部 web-verified，同名异源拆出 13 组），其余 90 个为整理者
#     熟知资源标 known。

#####################################################################
# 1. 规范资源条目
#    kind 取其主要角色；papers 列为语料内提及篇数（>=3 的口径）。
#####################################################################
