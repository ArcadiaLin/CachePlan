[project]
name = "cacheplan-utils-mineru"
version = "0.1.0"
description = "工具：把 PDF 经本地 MinerU2.5 vLLM 服务转成 Markdown"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# 只装 VL 客户端，不装 mineru[core,vllm]：后者与主线的 vLLM 版本冲突，
# 正是 experiments/p4a 被排除在 workspace 外的原因。客户端侧依赖树很轻
# （httpx / loguru / pillow / pydantic / tqdm，无 torch），可以进共享环境。
# 渲染用的 mutool 是系统二进制（mupdf-tools），不是 Python 依赖，运行时检查。
dependencies = ["mineru-vl-utils>=2.0.5,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 导入名是 utils.mineru。src/utils/ 刻意不放 __init__.py —— 它是 PEP 420
# 隐式命名空间包，这样以后 experiments/utils/ 下再加工具（各自一个 member，
# 各自 src/utils/<name>/）能并进同一个 utils.* 命名空间，互不覆盖。
[tool.hatch.build.targets.wheel]
packages = ["src/utils"]
